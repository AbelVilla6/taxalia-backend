# Local approximation of the production topology.
#
# Fill in the required settings below (or load them from an env file) before
# starting the backend. Ollama is not included: it runs on its own host.
# SKIP_OLLAMA_CHECK lets the service boot and serve the blog without Ollama;
# chat will 5xx until OLLAMA_HOST points at a reachable instance.
#
# Usage:
#   docker compose up --build
#   # blog API:  http://localhost:4324/api/posts?lang=es
services:
  backend:
    build: .
    ports:
      - "4324:4324"
    environment:
      NODE_ENV: production
      PORT: "4324"
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST for backend docker-compose}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER for backend docker-compose}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD for backend docker-compose}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE for backend docker-compose}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      MYSQL_SSL: ${MYSQL_SSL:-false}
      # Explicit opt-in only; keep false in production.
      SEED_DEMO_CONTENT: "false"
      UPLOAD_DIR: /app/data/uploads
      SKIP_OLLAMA_CHECK: "1"
      CORS_ALLOWED_ORIGINS: "http://localhost:4321,http://localhost:4322,http://localhost:4399"
      LOG_LEVEL: info
      # Admin panel credentials must be provided explicitly.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME for backend docker-compose}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for backend docker-compose}
      # When you have an Ollama host, set these and drop SKIP_OLLAMA_CHECK:
      # OLLAMA_HOST: "http://host.docker.internal:11434/api"

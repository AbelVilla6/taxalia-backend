<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Taxalia · Panel de contenido</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <style>
      /* ── Design tokens ─────────────────────────────── */
      :root {
        --bg: #f5f0ea;
        --surface: #fff;
        --surface-soft: #faf6f0;
        --ink: #2b2522;
        --muted: #93867d;
        --primary: #4c362d;
        --primary-light: #6b4e41;
        --accent: #c8a15a;
        --accent-soft: rgba(200,161,90,0.15);
        --border: rgba(76,54,45,0.15);
        --border-focus: rgba(76,54,45,0.45);
        --danger: #8b3f35;
        --ok: #2f5a40;
        --ok-bg: rgba(73,107,85,0.1);
        --radius-sm: 0.45rem;
        --radius: 0.7rem;
        --radius-pill: 999px;
        --shadow-sm: 0 2px 8px rgba(76,54,45,0.08);
        --shadow: 0 4px 18px rgba(76,54,45,0.12);
      }

      /* ── Reset ─────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 0.9375rem;
        line-height: 1.55;
        background: var(--bg);
        color: var(--ink);
      }
      [hidden] { display: none !important; }

      /* ── Header ────────────────────────────────────── */
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1.5rem;
        height: 3.25rem;
        background: var(--primary);
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: var(--shadow);
      }
      .app-header-brand {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #fff;
      }
      .app-header-brand span {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
      }

      /* ── Main layout ───────────────────────────────── */
      main { max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.25rem 4rem; }

      /* ── Buttons ───────────────────────────────────── */
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: var(--radius-pill);
        padding: 0.5rem 1.1rem;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        background: var(--primary);
        color: #fff;
        transition: filter 0.15s, transform 0.1s, box-shadow 0.15s;
      }
      button:hover:not(:disabled) { filter: brightness(1.12); box-shadow: var(--shadow-sm); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.ghost {
        background: transparent;
        color: var(--primary);
        border: 1.5px solid var(--border);
      }
      button.ghost:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
      button.accent {
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        box-shadow: 0 4px 14px rgba(76,54,45,0.2);
      }
      button.danger { background: var(--danger); }
      button.icon-btn {
        width: 2rem;
        height: 2rem;
        padding: 0;
        border-radius: 50%;
        font-size: 1rem;
        line-height: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Form controls ─────────────────────────────── */
      input[type="text"], input[type="email"], input[type="date"],
      input[type="url"], input[type="password"], select, textarea {
        font: inherit;
        font-size: 0.9rem;
        width: 100%;
        padding: 0.6rem 0.85rem;
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--ink);
        transition: border-color 0.15s, box-shadow 0.15s;
        appearance: none;
      }
      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(76,54,45,0.1);
      }
      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--primary);
        margin: 0.9rem 0 0.3rem;
      }
      label.inline {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-direction: row;
        text-transform: none;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0;
        color: var(--ink);
        margin-top: 1rem;
        cursor: pointer;
      }
      input[type="checkbox"] { width: auto; accent-color: var(--primary); }
      small { color: var(--muted); font-size: 0.78rem; font-weight: 400; }

      /* ── Grid helpers ──────────────────────────────── */
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
      @media (max-width: 640px) { .row, .row-3 { grid-template-columns: 1fr; } }

      /* ── Card ──────────────────────────────────────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        box-shadow: var(--shadow-sm);
      }

      /* ── Messages ──────────────────────────────────── */
      .msg {
        padding: 0.65rem 0.9rem;
        border-radius: var(--radius-sm);
        margin: 0.6rem 0;
        font-size: 0.85rem;
        font-weight: 500;
        animation: fadeIn 0.2s ease;
      }
      .msg.err { background: rgba(139,63,53,0.1); color: var(--danger); border-left: 3px solid var(--danger); }
      .msg.ok  { background: var(--ok-bg); color: var(--ok); border-left: 3px solid var(--ok); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

      /* ── Pills ─────────────────────────────────────── */
      .pill {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 0.15rem 0.6rem;
        border-radius: var(--radius-pill);
        background: #ede4d9;
        color: var(--primary);
      }
      .pill.draft { background: #f3e0c8; color: #7a5b1e; }
      .pill.en    { background: rgba(76,54,45,0.08); }

      /* ── Toolbar ───────────────────────────────────── */
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
      }
      .toolbar-actions { display: flex; gap: 0.5rem; align-items: center; }
      .toolbar h2 { margin: 0; font-size: 1.3rem; font-weight: 700; }

      /* ── Table ─────────────────────────────────────── */
      .table-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }
      table { width: 100%; border-collapse: collapse; }
      th, td {
        text-align: left;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }
      th {
        background: var(--surface-soft);
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--primary);
      }
      tr:last-child td { border-bottom: none; }
      tr:hover td { background: rgba(76,54,45,0.02); }
      td.actions { display: flex; gap: 0.35rem; }

      /* ── Login ─────────────────────────────────────── */
      .login-wrap {
        max-width: 380px;
        margin: 4rem auto;
      }
      .login-logo {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-logo strong {
        display: block;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--primary);
      }
      .login-logo span {
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.05em;
      }

      /* ── Uploader row ──────────────────────────────── */
      .uploader { display: flex; gap: 0.5rem; align-items: stretch; }
      .uploader input { flex: 1; }

      /* ── Section divider ───────────────────────────── */
      .section-label {
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.4rem;
        margin: 1.75rem 0 0.75rem;
      }

      /* ── Editor actions row ────────────────────────── */
      .editor-save-row {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }

      /* ── Custom toolbar buttons ────────────────────── */
      .tui-media-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        color: #444;
        font-size: 15px;
        transition: background 0.12s;
      }
      .tui-media-btn:hover { background: rgba(76,54,45,0.1); color: var(--primary); }
      .tui-media-btn svg { display: block; }

      /* ── Toast UI Editor overrides ─────────────────── */
      .toastui-editor-defaultUI {
        border: 1.5px solid var(--border) !important;
        border-radius: var(--radius) !important;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        font-family: inherit !important;
      }
      .toastui-editor-toolbar {
        background: var(--surface-soft) !important;
        border-bottom: 1px solid var(--border) !important;
        padding: 4px 8px !important;
      }
      .toastui-editor-toolbar-group button:hover,
      .toastui-editor-toolbar-group button.active {
        background: var(--accent-soft) !important;
        color: var(--primary) !important;
      }
      .toastui-editor-contents,
      .toastui-editor .ProseMirror {
        font-family: inherit !important;
        font-size: 0.9375rem !important;
        color: var(--ink) !important;
        line-height: 1.7 !important;
        padding: 1rem 1.25rem !important;
      }
      .toastui-editor-md-preview {
        background: var(--surface-soft) !important;
        padding: 1rem 1.25rem !important;
        font-family: inherit !important;
        font-size: 0.9375rem !important;
        color: var(--ink) !important;
        line-height: 1.7 !important;
      }
      .toastui-editor-md-splitter { background: var(--border) !important; }
      .toastui-editor-tabs button.active {
        color: var(--primary) !important;
        border-bottom-color: var(--accent) !important;
        font-weight: 700 !important;
      }
      .toastui-editor-tabs button:hover { color: var(--primary) !important; }
      .toastui-editor-popup {
        border: 1px solid var(--border) !important;
        border-radius: var(--radius-sm) !important;
        box-shadow: var(--shadow) !important;
      }
      .toastui-editor-popup-body input,
      .toastui-editor-popup-body select {
        border: 1.5px solid var(--border) !important;
        border-radius: var(--radius-sm) !important;
        font-family: inherit !important;
      }
      .toastui-editor-popup-body input:focus {
        border-color: var(--border-focus) !important;
        box-shadow: 0 0 0 3px rgba(76,54,45,0.1) !important;
        outline: none !important;
      }
      .toastui-editor-ok-button {
        background: var(--primary) !important;
        border-radius: var(--radius-pill) !important;
        font-family: inherit !important;
        font-weight: 700 !important;
        letter-spacing: 0.03em !important;
        border: none !important;
      }
      .toastui-editor-cancel-button {
        border-radius: var(--radius-pill) !important;
        font-family: inherit !important;
        font-weight: 600 !important;
        color: var(--primary) !important;
        border-color: var(--border) !important;
      }
      .toastui-editor-ww-code-block,
      .toastui-editor-contents code {
        background: rgba(76,54,45,0.06) !important;
        color: var(--primary) !important;
        font-size: 0.875em !important;
      }
      .toastui-editor-contents blockquote {
        border-left-color: var(--accent) !important;
        background: var(--accent-soft) !important;
      }
      .toastui-editor-contents h1,
      .toastui-editor-contents h2,
      .toastui-editor-contents h3 { color: var(--primary) !important; }
      .toastui-editor-contents a { color: var(--primary-light) !important; }
      .toastui-editor-contents a:hover { color: var(--accent) !important; }
    </style>
  </head>
  <body>

    <!-- ══════════ HEADER ══════════ -->
    <header class="app-header">
      <div class="app-header-brand">
        <span></span>
        Taxalia &middot; Contenido
      </div>
      <button id="logout" class="ghost" hidden style="color:#fff;border-color:rgba(255,255,255,0.3);">
        Salir
      </button>
    </header>

    <main>

      <!-- ══════════ LOGIN ══════════ -->
      <section id="view-login" hidden>
        <div class="login-wrap card">
          <div class="login-logo">
            <strong>Taxalia</strong>
            <span>Panel de administración</span>
          </div>
          <div id="login-msg"></div>
          <label>Usuario</label>
          <input id="login-user" autocomplete="username" />
          <label>Contraseña</label>
          <input id="login-pass" type="password" autocomplete="current-password" />
          <div style="margin-top:1.25rem">
            <button id="login-btn" class="accent" style="width:100%">Entrar</button>
          </div>
        </div>
      </section>

      <!-- ══════════ LIST ══════════ -->
      <section id="view-list" hidden>
        <div class="toolbar">
          <h2>Artículos</h2>
          <button id="new-btn" class="accent">+ Nuevo artículo</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Título</th>
                <th>Idioma</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="list-body"></tbody>
          </table>
        </div>
      </section>

      <!-- ══════════ EDITOR ══════════ -->
      <section id="view-editor" class="card" hidden>
        <div class="toolbar">
          <h2 id="editor-title" style="margin:0">Nuevo artículo</h2>
          <button class="ghost" id="back-btn">← Volver</button>
        </div>

        <div id="editor-msg"></div>
        <input type="hidden" id="f-id" />

        <!-- Meta fields -->
        <p class="section-label">Información del artículo</p>
        <div class="row">
          <div><label>Título</label><input id="f-title" placeholder="Título del artículo" /></div>
          <div><label>Slug <small>(URL)</small></label><input id="f-slug" placeholder="mi-articulo" /></div>
        </div>
        <div class="row">
          <div>
            <label>Idioma</label>
            <select id="f-lang">
              <option value="es">Español (es)</option>
              <option value="en">English (en)</option>
            </select>
          </div>
          <div>
            <label>Clave de traducción <small>(enlaza es/en)</small></label>
            <input id="f-tkey" placeholder="mi-articulo" />
          </div>
        </div>
        <label>Descripción <small>(para SEO y listados)</small></label>
        <input id="f-description" placeholder="Breve descripción del artículo" />

        <p class="section-label">Autoría y etiquetas</p>
        <div class="row">
          <div><label>Autor</label><input id="f-author" value="Taxalia" /></div>
          <div>
            <label>Tags <small>(separados por coma)</small></label>
            <input id="f-tags" placeholder="impuestos, asesoría, expat" />
          </div>
        </div>
        <div class="row">
          <div><label>Fecha de publicación</label><input id="f-pubDate" type="date" /></div>
          <div><label>Fecha de actualización <small>(opcional)</small></label><input id="f-updatedDate" type="date" /></div>
        </div>

        <p class="section-label">Imagen de portada</p>
        <label>URL de portada</label>
        <div class="uploader">
          <input id="f-heroImage" placeholder="/uploads/..." />
          <button class="ghost" type="button" id="hero-upload">↑ Subir</button>
        </div>
        <label>Texto alternativo de portada</label>
        <input id="f-heroAlt" placeholder="Descripción de la imagen para accesibilidad" />

        <label class="inline" style="margin-top:1rem">
          <input id="f-draft" type="checkbox" style="width:auto" />
          Borrador <small style="font-weight:400">(no se publica hasta que se desmarque)</small>
        </label>

        <!-- WYSIWYG content editor -->
        <p class="section-label">Contenido del artículo</p>
        <div id="editor-mount" style="min-height:520px;"></div>

        <div class="editor-save-row">
          <button id="save-btn" class="accent">Guardar artículo</button>
          <button class="danger" id="delete-btn" hidden>Eliminar artículo</button>
        </div>
      </section>

    </main>

    <!-- Hidden file picker (shared) -->
    <input type="file" id="file-picker"
      accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"
      hidden />

    <!-- Toast UI Editor -->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
